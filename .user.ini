; پارس سازه و آفیس | تنظیمات PHP در سطح پوشه (هاست اشتراکی CGI / FastCGI)
; ---------------------------------------------------------------------------
; این فایل روی هاست‌هایی که PHP را با CGI/FastCGI اجرا می‌کنند (بیشتر هاست‌های
; اشتراکی Plesk و cPanel) اثر دارد و جای php.ini را می‌گیرد.
;
; ⚠️ توجه: مقدار display_errors برای «عیب‌یابی خطای ۵۰۰» روی On گذاشته شده است.
;    پس از رفع مشکل، آن را به Off تغییر دهید تا جزئیات فنی برای بازدیدکننده
;    نمایش داده نشود (خطاها همچنان در error_log ثبت می‌شوند).

display_errors = On
error_reporting = E_ALL
log_errors = On

; مقادیر اجرایی مناسب فروشگاه
max_execution_time = 90
upload_max_filesize = 10M
post_max_size = 10M
default_charset = "UTF-8"
