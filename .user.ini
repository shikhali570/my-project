; Per-folder PHP settings (shared hosting running PHP as CGI / FastCGI).
; Works on IIS (Windows hosts, Plesk) and on Linux hosts with CGI/FastCGI.
; This file is ASCII-only on purpose: an FTP client in "ASCII mode" can corrupt
; UTF-8 bytes, and a corrupted ini file is silently ignored by PHP.
;
; NOTES
;  - PHP caches this file for user_ini.cache_ttl seconds (default 300 = 5 min).
;    After editing it, wait up to 5 minutes or recycle the application pool.
;  - Only PHP_INI_ALL / PHP_INI_PERDIR directives are honoured here.
;    System-level directives (for example extension=..., open_basedir,
;    fastcgi.impersonate) must be changed in the hosting panel / php.ini.
;  - If the effective values shown by check.php differ from this file, the host
;    does not read .user.ini; set the same values in the panel instead
;    (Plesk: Websites & Domains -> PHP Settings).
;
; WARNING: display_errors is ON for debugging. Set it to Off after the site
; works, so technical details are not shown to visitors (errors are still
; written to the PHP error log).

display_errors = On
error_reporting = E_ALL
log_errors = On

; Runtime limits suitable for this shop
memory_limit = 256M
max_execution_time = 90
max_input_time = 90
max_input_vars = 3000
upload_max_filesize = 10M
post_max_size = 12M
default_charset = "UTF-8"

; Sessions
; The application automatically creates ./tmp/sessions and uses it when the
; server default session path is missing or not writable (a very common cause
; of "login does not stick" on IIS with fastcgi.impersonate = 1).
; You may also force a path here, for example:
; session.save_path = "C:\inetpub\vhosts\example.com\tmp\sessions"
session.use_strict_mode = 1
session.cookie_httponly = 1
session.gc_maxlifetime = 86400
